name: Build generic artifact engine

on:
  push:
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: pytest -q
      - run: python build.py examples/financial.json --output output/financial
      - run: python build.py examples/operations.json --output output/operations
      - run: python build.py --batch examples --output output/batch
      - uses: actions/upload-artifact@v4
        with:
          name: generated-artifacts
          path: output/
